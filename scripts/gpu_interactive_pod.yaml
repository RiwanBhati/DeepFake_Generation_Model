apiVersion: v1
kind: Pod
metadata:
  name: deepfake-gpu-worker
  namespace: dgx-s-bmu-soet-240611-restricted
spec:
  restartPolicy: Never
  dnsPolicy: "None"
  dnsConfig:
    nameservers:
      - 10.1.0.2
      - 10.1.0.235
      - 8.8.8.8
    searches:
      - cm.cluster
      - eth.cluster
      - nvidia.com
  volumes:
  - name: user-home
    hostPath:
      path: /home/dgx-s-bmu-soet-240611
      type: Directory
  containers:
  - name: cuda-runner
    image: nvcr.io/nvidia/pytorch:24.12-py3
    imagePullPolicy: IfNotPresent
    command: ["sleep", "86400"]
    workingDir: /workspace/projects/DeepFake_Generation_Model
    env:
    - name: HOME
      value: /workspace
    - name: HF_HOME
      value: /workspace/.cache/huggingface
    - name: UV_CACHE_DIR
      value: /workspace/.cache/uv
    volumeMounts:
    - name: user-home
      mountPath: /workspace
    resources:
      requests:
        cpu: "8"
        memory: "16Gi"
        nvidia.com/mig-2g.35gb: "1"
      limits:
        cpu: "16"
        memory: "32Gi"
        nvidia.com/mig-2g.35gb: "1"

